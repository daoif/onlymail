[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onlymail-sdk"
version = "0.1.0"
description = "Python SDK for the OnlyMail API"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["onlymail_sdk*"]
