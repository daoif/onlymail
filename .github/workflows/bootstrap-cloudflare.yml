name: Bootstrap Cloudflare

on:
  workflow_dispatch:
    inputs:
      cf_default_zone_id:
        description: Cloudflare Zone ID
        required: true
        type: string
      cf_default_worker_name:
        description: Worker 名称
        required: false
        default: mails-worker
        type: string
      cf_default_pages_project:
        description: Pages 项目名称
        required: false
        default: mails-frontend
        type: string

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    name: Bootstrap Cloudflare resources
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Cloudflare
        run: pnpm run init
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SETUP_GITHUB_SKIP_SECRETS: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          CF_DEFAULT_ZONE_ID: ${{ inputs.cf_default_zone_id }}
          CF_DEFAULT_WORKER_NAME: ${{ inputs.cf_default_worker_name }}
          CF_DEFAULT_PAGES_PROJECT: ${{ inputs.cf_default_pages_project }}
