name: Bootstrap Cloudflare

on:
  workflow_dispatch:
    inputs:
      cf_default_worker_name:
        description: Worker 名称
        required: false
        default: mails-worker
        type: string
      cf_default_pages_project:
        description: Pages 项目名称
        required: false
        default: mails-frontend
        type: string
  push:
    paths:
      - '.github/workflows/bootstrap-cloudflare.yml'

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    name: Bootstrap Cloudflare resources
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Cloudflare
        run: pnpm run init
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAILS_REQUIRE_GITHUB_SYNC: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CF_DEFAULT_WORKER_NAME: ${{ inputs.cf_default_worker_name }}
          CF_DEFAULT_PAGES_PROJECT: ${{ inputs.cf_default_pages_project }}
