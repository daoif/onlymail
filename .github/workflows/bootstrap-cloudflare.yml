name: Bootstrap Cloudflare
# Re-pushed once after public repo creation so GitHub indexes this workflow reliably.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-cloudflare.yml'

permissions:
  contents: read
  actions: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Bootstrap Cloudflare resources
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Cloudflare
        run: pnpm run init
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAILS_REQUIRE_GITHUB_SYNC: 'true'
          SETUP_GITHUB_SKIP_SECRETS: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
