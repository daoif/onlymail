name: Release SDK Assets

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-sdk-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python build dependency
        run: python -m pip install build

      - name: Build SDK release assets
        run: pnpm build:sdk:artifacts

      - name: Verify SDK release assets
        run: pnpm check:sdk:artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdk-release-assets
          path: |
            dist-sdk/nodejs/*.tgz
            dist-sdk/python/*.whl
            dist-sdk/python/*.tar.gz

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist-sdk/nodejs/*.tgz
            dist-sdk/python/*.whl
            dist-sdk/python/*.tar.gz
