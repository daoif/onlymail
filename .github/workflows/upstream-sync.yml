name: Upstream Sync

on:
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: 上游仓库，格式 owner/repo
        required: false
        type: string
  schedule:
    - cron: '17 */12 * * *'
  push:
    paths:
      - '.github/workflows/upstream-sync.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync with upstream
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream repository
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPOSITORY="${INPUT_UPSTREAM_REPOSITORY:-${UPSTREAM_REPOSITORY_VAR:-}}"
          if [ -z "$UPSTREAM_REPOSITORY" ]; then
            echo "缺少上游仓库。请在 workflow 输入 upstream_repository，或设置仓库变量 UPSTREAM_REPOSITORY。"
            exit 1
          fi
          echo "UPSTREAM_REPOSITORY=$UPSTREAM_REPOSITORY" >> "$GITHUB_ENV"
        env:
          INPUT_UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
          UPSTREAM_REPOSITORY_VAR: ${{ vars.UPSTREAM_REPOSITORY }}

      - name: Sync default branch
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BEFORE_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch upstream "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git merge --ff-only "upstream/$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "SYNC_BASE_SHA=$BEFORE_SHA" >> "$GITHUB_ENV"
          echo "SYNC_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch downstream workflows
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SYNC_BASE_SHA" = "$SYNC_HEAD_SHA" ]; then
            echo "没有新提交，跳过后续 workflow"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$SYNC_BASE_SHA" "$SYNC_HEAD_SHA")"
          echo "$CHANGED_FILES"

          gh workflow run ci.yml -R "$GITHUB_REPOSITORY"

          if echo "$CHANGED_FILES" | grep -Eq '^(worker/|worker/db/migrations/|worker/wrangler.toml.template|scripts/deploy-worker.ts|scripts/render-wrangler.ts|scripts/lib/local-config.ts|scripts/lib/d1-migrations.ts|scripts/lib/wrangler-config.ts|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
            gh workflow run deploy-worker.yml -R "$GITHUB_REPOSITORY"
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^(frontend/|scripts/deploy-frontend.ts|scripts/lib/local-config.ts|scripts/lib/cloudflare-api.ts|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
            gh workflow run deploy-frontend.yml -R "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
