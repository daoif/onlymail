name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    name: Build, Test & Check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Check scripts
        run: pnpm check:scripts

      - name: Check Python SDK
        run: pnpm check:python

      - name: Install Python build dependency
        run: python -m pip install build

      - name: Build SDK release assets
        run: pnpm build:sdk:artifacts

      - name: Verify SDK release assets
        run: pnpm check:sdk:artifacts
